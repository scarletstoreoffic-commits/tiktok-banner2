<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTokmods</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner {
            position: relative;
            width: min(100%, 1536px);
        }

        .banner img {
            display: block;
            width: 100%;
            height: auto;
        }

        .button {
            position: absolute;
            bottom: 5.5%;
            height: 15%;
            border-radius: 30px;
            cursor: pointer;
        }

        /* Левая кнопка «Закрыть» */
        .close-button {
            left: 5%;
            width: 44%;
        }

        /* Правая кнопка Telegram */
        .telegram-button {
            right: 5%;
            width: 44%;
        }
    </style>
</head>
<body>
    <div class="banner" id="banner">
        <img src="img/banner.png" alt="TikTokmods">

        <a
            class="button telegram-button"
            href="https://t.me/adrmodtt"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Telegram">
        </a>

        <button
            class="button close-button"
            type="button"
            aria-label="Закрыть"
            onclick="document.getElementById('banner').style.display='none';">
        </button>
    </div>
</body>
</html>
